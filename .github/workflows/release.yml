name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="sshady"
          [ "$GOOS" = "windows" ] && BIN="sshady.exe"

          go build -trimpath -ldflags="-s -w -X sshady/cmd.version=$VERSION" -o "$BIN" .

          # Raw binary, for direct download
          RAW="sshady_${GOOS}_${GOARCH}"
          [ "$GOOS" = "windows" ] && RAW="sshady_${GOOS}_${GOARCH}.exe"
          cp "$BIN" "$RAW"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"

          # Archive with binary + docs + man pages (built in dist/ to
          # avoid clashing with the raw binary name)
          PKG="sshady_${GOOS}_${GOARCH}"
          mkdir -p "dist/$PKG"
          mv "$BIN" "dist/$PKG/"
          cp README.md "dist/$PKG/"
          cp -r man "dist/$PKG/"

          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -r "../$PKG.zip" "$PKG")
          else
            tar czf "$PKG.tar.gz" -C dist "$PKG"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.raw }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum sshady_*_* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sshady_*_*
            checksums.txt
